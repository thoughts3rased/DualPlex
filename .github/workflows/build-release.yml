name: Build and Release

# Rebuilds DualPlex on every push to main and republishes a single rolling
# "nightly" GitHub Release with the .3dsx/.cia attached, plus a QR code that
# points at the .cia's download URL for FBI's "Remote Install (QR)" feature
# on real 3DS hardware. Re-running (either via a new push or manually below)
# updates that same release/tag in place rather than accumulating a new one
# per commit - see the "Publish" step if you'd rather have one release per
# build instead.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A second push landing mid-build would otherwise race the first over the
# same working tree and the same "nightly" release/tag.
concurrency:
  group: build-release
  cancel-in-progress: true

permissions:
  contents: write # required to create/update the release and its tag

env:
  # Assumes devkitPro is installed at its standard default location on the
  # runner. Adjust these two if your self-hosted runner has it elsewhere -
  # everything below only depends on these, not on any shell profile/rc file
  # having set them up already (self-hosted runners commonly run as a
  # service account whose non-interactive environment won't have picked up
  # anything exported in your own interactive login shell).
  DEVKITPRO: /opt/devkitpro
  DEVKITARM: /opt/devkitpro/devkitARM

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cached across runs, keyed on a fixed version string below - bump it
      # (v1 -> v2) to force a clean reinstall if the toolchain ever needs
      # refreshing. On a cache hit this and the next step are both skipped
      # entirely: everything the build needs (devkitARM, libctru, portlibs)
      # lives under /opt/devkitpro, so a restored cache is immediately
      # usable without dkp-pacman being present at all.
      - name: Cache devkitPro toolchain
        id: cache-devkitpro
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro
          key: devkitpro-3ds-v1

      # The runner's container has no devkitPro (or anything it needs) baked
      # in, so it's installed here on a cache miss. This is a from-scratch
      # reimplementation of devkitPro's own install-devkitpro-pacman script
      # rather than curl | bash-ing it directly - that script (a) has no -y
      # on any of its apt-get calls, so it hangs/fails waiting for input
      # with no TTY attached (exactly what CI is), and (b) apt.devkitpro.org
      # 403s any request without a "dkp-apt"-ish User-Agent, which curl/wget
      # don't send by default. Sets DEBIAN_FRONTEND=noninteractive too, for
      # any transitive package that pops a debconf prompt.
      # Needs root: runs bare if already root (common for a minimal CI
      # container image), otherwise via sudo (assumed passwordless, as is
      # standard for CI runners) - adjust if your runner needs something
      # else here.
      - name: Install devkitPro toolchain (3DS dev packages)
        if: steps.cache-devkitpro.outputs.cache-hit != 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo -E"; fi

          $SUDO apt-get update
          $SUDO apt-get install -y apt-transport-https ca-certificates wget gnupg unzip

          mkdir -p /tmp/devkitpro-keyring
          wget -q -U "dkp-apt" -O /tmp/devkitpro-keyring/devkitpro-pub.gpg https://apt.devkitpro.org/devkitpro-pub.gpg
          $SUDO mkdir -p /usr/share/keyring
          $SUDO cp /tmp/devkitpro-keyring/devkitpro-pub.gpg /usr/share/keyring/devkitpro-pub.gpg
          echo "deb [signed-by=/usr/share/keyring/devkitpro-pub.gpg] https://apt.devkitpro.org stable main" | $SUDO tee /etc/apt/sources.list.d/devkitpro.list

          $SUDO apt-get update
          $SUDO apt-get install -y devkitpro-pacman

          $SUDO dkp-pacman -Sy --noconfirm 3ds-dev 3ds-curl 3ds-mpg123 3ds-mbedtls

          # makerom (used for the .cia build) isn't a devkitPro package at
          # all - it's a separate tool from Project_CTR that devkitPro's own
          # docs point you at downloading manually and adding to PATH.
          # Placed under /opt/devkitpro/tools/bin so it's covered by the
          # cache above too, alongside everything dkp-pacman just installed.
          MAKEROM_VERSION="v0.19.0"
          wget -q "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-${MAKEROM_VERSION}/makerom-${MAKEROM_VERSION}-ubuntu_x86_64.zip" -O /tmp/makerom.zip
          $SUDO mkdir -p /opt/devkitpro/tools/bin
          $SUDO unzip -o /tmp/makerom.zip -d /opt/devkitpro/tools/bin/
          $SUDO chmod +x /opt/devkitpro/tools/bin/makerom

      - name: Build (.elf, .3dsx, .cia)
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          make clean
          make
          ls -la DualPlex.elf DualPlex.3dsx DualPlex.cia

      # Points at the exact URL this same release publishes DualPlex.cia at
      # (predictable from the tag name below, independent of upload order -
      # constructing it doesn't require the upload to have happened yet,
      # only for the QR to actually resolve once it has). Uses a public
      # QR-generation API (goqr.me) via plain curl rather than installing a
      # QR tool locally (e.g. qrencode), since that'd need apt/sudo access
      # this workflow can't assume your self-hosted runner grants it -
      # swap this step for `qrencode` directly if you'd rather not depend
      # on a third party (the URL itself is already public once released,
      # so there's nothing sensitive being sent).
      - name: Generate QR code (CIA remote-install link)
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/nightly/DualPlex.cia"
          curl -sf -G "https://api.qrserver.com/v1/create-qr-code/" \
            --data-urlencode "size=300x300" \
            --data-urlencode "data=${DOWNLOAD_URL}" \
            -o DualPlex-qr.png

      - name: Publish rolling "nightly" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "DualPlex (nightly build)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          body: |
            Automated build from commit ${{ github.sha }}, replaces the previous nightly build.

            - **DualPlex.cia**: install with [FBI](https://github.com/Steveice10/FBI) - either sideload the file directly, or open FBI's "Remote Install" QR scanner on your 3DS and scan `DualPlex-qr.png` below to fetch and install it directly, no PC transfer needed.
            - **DualPlex.3dsx**: copy to `/3ds/` on your SD card to run via the Homebrew Launcher.
          files: |
            DualPlex.cia
            DualPlex.3dsx
            DualPlex-qr.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
