name: Build and Release

# Rebuilds DualPlex on every push to main and republishes a single rolling
# "nightly" GitHub Release with the .3dsx/.cia attached, plus a QR code that
# points at the .cia's download URL for FBI's "Remote Install (QR)" feature
# on real 3DS hardware. Re-running (either via a new push or manually below)
# updates that same release/tag in place rather than accumulating a new one
# per commit - see the "Publish" step if you'd rather have one release per
# build instead.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A second push landing mid-build would otherwise race the first over the
# same working tree and the same "nightly" release/tag.
concurrency:
  group: build-release
  cancel-in-progress: true

permissions:
  contents: write # required to create/update the release and its tag

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITARM: /opt/devkitpro/devkitARM

jobs:
  build:
    runs-on: ubuntu-24.04
    # Runs inside devkitPro's own image rather than apt/dkp-pacman-installing
    # the toolchain onto the bare runner: devkitARM + libctru + citro2d/
    # citro3d (the 3ds-dev group) ship in it already, which sidesteps two
    # separate problems hit getting here - the runner's glibc being too old
    # for devkitARM's Arch-built binaries (irrelevant now: the compiler and
    # the libc it needs both come from this image), and pkg.devkitpro.org
    # 403ing dkp-pacman's own database sync when installing devkitpro-pacman
    # fresh on a bare runner (this image already has a working pacman setup
    # baked in). GitHub-hosted runners support job containers natively, so
    # none of the Docker-outside-of-Docker path-mount issues that ruled this
    # out on a self-hosted runner apply here.
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # devkitARM itself, plus libctru/citro2d/citro3d, already ship in the
      # image. Only the extra portlibs this project links against, and
      # makerom (not a devkitPro package at all), are missing - cached here
      # across runs since the image itself is re-pulled fresh every time
      # regardless (GitHub-hosted runners don't persist Docker layers
      # between separate job runs).
      - name: Cache 3DS portlibs + makerom
        id: cache-extras
        uses: actions/cache@v4
        with:
          path: |
            /opt/devkitpro/portlibs
            /opt/devkitpro/tools/bin/makerom
            /opt/devkitpro/tools/glibc-makerom
          key: devkitpro-3ds-extras-v5

      - name: Install missing 3DS portlibs + makerom
        if: steps.cache-extras.outputs.cache-hit != 'true'
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo -E"; fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends wget unzip

          # apt.devkitpro.org's WAF rule turned out to be satisfied by
          # *any* non-default UA string, which is why plain "dkp-pacman"
          # worked fine for it every single time below. pkg.devkitpro.org
          # is fronted by the same Cloudflare setup but has kept 403ing
          # that same "dkp-pacman" string intermittently regardless - a
          # public devkitPro/pacman issue (#62) on this exact 403 confirms
          # the difference: only a *real browser* User-Agent got a
          # reporter past it, not just any non-curl/wget-looking string.
          # Use one everywhere a devkitPro host gets hit, since Cloudflare
          # bot-scoring apparently checks more than "is this the literal
          # wget/curl default".
          BROWSER_UA="Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"

          # /etc/wgetrc's user_agent line is parsed by wget itself as the
          # rest of the line, not shell-tokenized - safe for a UA value
          # with spaces in it. Set it globally rather than passing
          # --user-agent on the XferCommand line below: classic pacman
          # splits XferCommand on whitespace and execs it directly, with no
          # shell involved, so a quoted multi-word value inline there isn't
          # guaranteed to survive as one argv token the way the old
          # single-word "dkp-pacman" string happened to. Every wget call
          # below (XferCommand's included) just inherits this default.
          echo "user_agent = $BROWSER_UA" | $SUDO tee -a /etc/wgetrc >/dev/null

          # pkg.devkitpro.org 403s plain wget/curl-style User-Agents (same
          # WAF rule apt.devkitpro.org has), which is what broke a bare
          # dkp-pacman install on the runner directly - this image's own
          # pacman.conf turns out not to already handle it either. Needs to
          # go specifically under the [options] section - appending to
          # end-of-file landed it inside pacman.conf's last repo section
          # instead (whichever one happens to be last), where pacman just
          # warns and ignores it:
          #   warning: config file .../pacman.conf, line 84: directive
          #   'XferCommand' in section 'dkp-linux' not recognized.
          PACMAN_CONF="$DEVKITPRO/pacman/etc/pacman.conf"
          if ! grep -q '^XferCommand' "$PACMAN_CONF"; then
            $SUDO sed -i '/^\[options\]/a XferCommand = /usr/bin/wget -O %o %u' "$PACMAN_CONF"
          fi

          # Once the 403 above is out of the way, the sync still fails -
          # consistently, on byte-identical downloads each time, so it's not
          # a corrupted-transfer problem:
          #   error: dkp-libs: signature from "... WinterMute ..." is
          #   invalid
          # This image's pacman keyring was bootstrapped once, whenever the
          # image was last built, and baked into that layer, with
          # insufficient trust for one of devkitPro's real signing keys.
          # `apt-get install --reinstall devkitpro-pacman` looked like the
          # fix (force postinst to redo the bootstrap) and was tried at
          # length here, but it's a dead end two ways over: apt reported
          # the *same* package version installed before and after, so the
          # postinst reran against byte-identical bundled key data each
          # time - reinstalling never changes what gets trusted, only a
          # rebuilt .deb would. And reinstalling also runs postinst's own
          # automatic `-Sy` sync as a side effect of `dpkg --configure`,
          # which - still under-trusted - fails and takes the whole apt
          # transaction down with it (dpkg then leaves the package
          # half-configured, and a bare retry of the reinstall hits a
          # separate apt bug on top: "No file name for
          # devkitpro-pacman:amd64").
          #
          # None of that dance is actually necessary. The real fix below
          # sources keys fresh from GitHub directly, independent of
          # whatever's bundled in the .deb - so it doesn't need the package
          # reinstalled, dpkg/apt touched, or the existing gnupg dir wiped
          # at all. Just make sure a master key exists (idempotent, and the
          # image already has one from its own bootstrap at build time),
          # then layer devkitPro's canonical keyring on top and fully
          # trust every key in it.
          GNUPGHOME="$DEVKITPRO/pacman/etc/pacman.d/gnupg"
          $SUDO dkp-pacman-key --init

          mkdir -p /tmp/devkitpro-keyring
          wget -q -O /tmp/devkitpro-keyring/devkitpro.gpg https://raw.githubusercontent.com/devkitPro/devkitpro-keyring/master/devkitpro.gpg
          $SUDO gpg --homedir "$GNUPGHOME" --import /tmp/devkitpro-keyring/devkitpro.gpg
          for KEYID in $($SUDO gpg --homedir "$GNUPGHOME" --list-keys --with-colons | awk -F: '/^pub/{print $5}'); do
            $SUDO dkp-pacman-key --lsign-key "$KEYID"
          done

          # pkg.devkitpro.org's WAF has now both let this sync through
          # clean (twice) and 403'd it (three times) across otherwise
          # identical runs, with no consistent correlation to which UA
          # workaround was or wasn't in place at the time - genuine
          # intermittent behavior on Cloudflare's end (IP-based
          # rate-limiting/reputation on shared GitHub-runner IPs, or
          # TLS-fingerprint-based bot scoring that a UA header alone can't
          # fully cover) rather than a deterministic gap this script can
          # close outright. Retry with backoff rather than chase it further.
          RETRIES=5
          n=0
          until $SUDO dkp-pacman -Sy --noconfirm 3ds-curl 3ds-mpg123 3ds-mbedtls; do
            n=$((n + 1))
            if [ "$n" -ge "$RETRIES" ]; then
              echo "::error::dkp-pacman -Sy failed after $RETRIES attempts (pkg.devkitpro.org WAF/rate-limit)" >&2
              exit 1
            fi
            echo "dkp-pacman -Sy failed (attempt $n/$RETRIES) - retrying in 15s..." >&2
            sleep 15
          done

          # makerom (used for the .cia build) isn't a devkitPro package at
          # all - it's a separate tool from Project_CTR that devkitPro's own
          # docs point you at downloading manually and adding to PATH.
          # Placed under /opt/devkitpro/tools/bin so it's covered by the
          # cache above too, alongside the portlibs dkp-pacman just
          # installed.
          MAKEROM_VERSION="v0.19.0"
          wget -q "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-${MAKEROM_VERSION}/makerom-${MAKEROM_VERSION}-ubuntu_x86_64.zip" -O /tmp/makerom.zip
          $SUDO mkdir -p /opt/devkitpro/tools/bin
          $SUDO unzip -o /tmp/makerom.zip -d /opt/devkitpro/tools/bin/
          $SUDO chmod +x /opt/devkitpro/tools/bin/makerom

          # makerom's prebuilt Ubuntu binary needs GLIBC_2.38, newer than
          # what devkitpro/devkitarm's own base image ships (unlike
          # devkitARM/devkitPro's own tools, which are baked into this image
          # already and match its glibc fine - makerom is the one binary
          # here that comes from somewhere else entirely):
          #   makerom: /lib/x86_64-linux-gnu/libc.so.6: version
          #   `GLIBC_2.38' not found (required by makerom)
          # Download Debian 13 (trixie)'s libc6 into a private prefix and
          # patchelf just this one binary at it, rather than touching the
          # container's own system libc6. Every run gets a fresh container
          # instance, so there's no persistent state to worry about
          # compounding across runs here.
          $SUDO apt-get install -y --no-install-recommends patchelf

          GLIBC_PREFIX="$DEVKITPRO/tools/glibc-makerom"
          mkdir -p "$GLIBC_PREFIX" /tmp/glibc-deb
          wget -q "http://deb.debian.org/debian/dists/trixie/main/binary-amd64/Packages.gz" -O /tmp/glibc-deb/Packages.gz
          gunzip -f /tmp/glibc-deb/Packages.gz
          LIBC6_PATH=$(awk '/^Package: libc6$/{f=1} f&&/^Filename:/{print $2; exit} /^$/{f=0}' /tmp/glibc-deb/Packages)
          wget -q "http://deb.debian.org/debian/$LIBC6_PATH" -O /tmp/glibc-deb/libc6.deb
          dpkg -x /tmp/glibc-deb/libc6.deb "$GLIBC_PREFIX"

          # Debian's libc6 .deb ships the dynamic linker as the real file
          # under lib/x86_64-linux-gnu/, with lib64/ld-linux-x86-64.so.2 as
          # an *absolute* symlink to it - following that inside our private
          # prefix would land back on the container's own old system loader,
          # so resolve to the real (non-symlink) file instead.
          NEWLD=$(find "$GLIBC_PREFIX" -name 'ld-linux-x86-64.so.2' -type f | head -1)
          if [ -z "$NEWLD" ]; then
            echo "::error::Couldn't find the real ld-linux-x86-64.so.2 inside $GLIBC_PREFIX - libc6 layout may have changed upstream" >&2
            exit 1
          fi
          patchelf --set-interpreter "$NEWLD" /opt/devkitpro/tools/bin/makerom
          patchelf --set-rpath "$GLIBC_PREFIX/lib/x86_64-linux-gnu" /opt/devkitpro/tools/bin/makerom

      - name: Build (.elf, .3dsx, .cia)
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          make clean
          make
          ls -la DualPlex.elf DualPlex.3dsx DualPlex.cia

      # Points at the exact URL this same release publishes DualPlex.cia at
      # (predictable from the tag name below, independent of upload order -
      # constructing it doesn't require the upload to have happened yet,
      # only for the QR to actually resolve once it has). Uses a public
      # QR-generation API (goqr.me) via plain curl rather than installing a
      # QR tool locally (e.g. qrencode) - swap this step for `qrencode`
      # directly if you'd rather not depend on a third party (the URL
      # itself is already public once released, so there's nothing
      # sensitive being sent).
      - name: Generate QR code (CIA remote-install link)
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/nightly/DualPlex.cia"
          curl -sf -G "https://api.qrserver.com/v1/create-qr-code/" \
            --data-urlencode "size=300x300" \
            --data-urlencode "data=${DOWNLOAD_URL}" \
            -o DualPlex-qr.png

      - name: Publish rolling "nightly" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "DualPlex (nightly build)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          body: |
            Automated build from commit ${{ github.sha }}, replaces the previous nightly build.

            - **DualPlex.cia**: install with [FBI](https://github.com/Steveice10/FBI) - either sideload the file directly, or open FBI's "Remote Install" QR scanner on your 3DS and scan `DualPlex-qr.png` below to fetch and install it directly, no PC transfer needed.
            - **DualPlex.3dsx**: copy to `/3ds/` on your SD card to run via the Homebrew Launcher.
          files: |
            DualPlex.cia
            DualPlex.3dsx
            DualPlex-qr.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
