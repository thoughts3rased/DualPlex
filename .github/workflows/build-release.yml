name: Build and Release

# Rebuilds DualPlex on every push to main and republishes a single rolling
# "nightly" GitHub Release with the .3dsx/.cia attached, plus a QR code that
# points at the .cia's download URL for FBI's "Remote Install (QR)" feature
# on real 3DS hardware. Re-running (either via a new push or manually below)
# updates that same release/tag in place rather than accumulating a new one
# per commit - see the "Publish" step if you'd rather have one release per
# build instead.
#
# Pushing a "V*" tag (e.g. V1.0) instead builds and publishes a proper,
# permanent, versioned GitHub Release under that same tag name - separate
# from and left untouched by every subsequent nightly rebuild - see
# "Determine release parameters" below for how the two are told apart.
on:
  push:
    branches: [main]
    tags: ['V*']
  workflow_dispatch: {}

# A second push landing mid-build would otherwise race the first over the
# same working tree and the same release/tag - scoped per-ref (rather than
# one group for the whole workflow) so a nightly rebuild on main and a
# versioned-tag release build never cancel each other, only a genuine rerun
# of the exact same ref.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required to create/update the release and its tag

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITARM: /opt/devkitpro/devkitARM

jobs:
  build:
    runs-on: ubuntu-24.04
    # Runs inside devkitPro's own image rather than apt/dkp-pacman-installing
    # the toolchain onto the bare runner: devkitARM + libctru + citro2d/
    # citro3d (the 3ds-dev group) ship in it already, which sidesteps two
    # separate problems hit getting here - the runner's glibc being too old
    # for devkitARM's Arch-built binaries (irrelevant now: the compiler and
    # the libc it needs both come from this image), and pkg.devkitpro.org
    # 403ing dkp-pacman's own database sync when installing devkitpro-pacman
    # fresh on a bare runner (this image already has a working pacman setup
    # baked in). GitHub-hosted runners support job containers natively, so
    # none of the Docker-outside-of-Docker path-mount issues that ruled this
    # out on a self-hosted runner apply here.
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # devkitARM itself, plus libctru/citro2d/citro3d, already ship in the
      # image. Only the extra portlibs this project links against, and
      # makerom + bannertool (neither a devkitPro package at all), are
      # missing - cached here across runs since the image itself is
      # re-pulled fresh every time regardless (GitHub-hosted runners don't
      # persist Docker layers between separate job runs).
      - name: Cache 3DS portlibs + makerom + bannertool
        id: cache-extras
        uses: actions/cache@v4
        with:
          path: |
            /opt/devkitpro/portlibs
            /opt/devkitpro/tools/bin/makerom
            /opt/devkitpro/tools/bin/bannertool
          # v8: added bannertool alongside makerom - bumped so every runner
          # actually rebuilds it once, rather than reusing a v7 cache that
          # has portlibs/makerom but no bannertool in it and skipping the
          # step that would've built it (see that step's own "if:").
          key: devkitpro-3ds-extras-v8

      - name: Install missing 3DS portlibs + makerom + bannertool
        if: steps.cache-extras.outputs.cache-hit != 'true'
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo -E"; fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends wget unzip

          # apt.devkitpro.org's WAF rule turned out to be satisfied by
          # *any* non-default UA string, which is why plain "dkp-pacman"
          # worked fine for it every single time below. pkg.devkitpro.org
          # is fronted by the same Cloudflare setup but has kept 403ing
          # that same "dkp-pacman" string intermittently regardless - a
          # public devkitPro/pacman issue (#62) on this exact 403 confirms
          # the difference: only a *real browser* User-Agent got a
          # reporter past it, not just any non-curl/wget-looking string.
          # Use one everywhere a devkitPro host gets hit, since Cloudflare
          # bot-scoring apparently checks more than "is this the literal
          # wget/curl default".
          BROWSER_UA="Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"

          # /etc/wgetrc's user_agent line is parsed by wget itself as the
          # rest of the line, not shell-tokenized - safe for a UA value
          # with spaces in it. Set it globally rather than passing
          # --user-agent on the XferCommand line below: classic pacman
          # splits XferCommand on whitespace and execs it directly, with no
          # shell involved, so a quoted multi-word value inline there isn't
          # guaranteed to survive as one argv token the way the old
          # single-word "dkp-pacman" string happened to. Every wget call
          # below (XferCommand's included) just inherits this default.
          echo "user_agent = $BROWSER_UA" | $SUDO tee -a /etc/wgetrc >/dev/null

          # pkg.devkitpro.org 403s plain wget/curl-style User-Agents (same
          # WAF rule apt.devkitpro.org has), which is what broke a bare
          # dkp-pacman install on the runner directly - this image's own
          # pacman.conf turns out not to already handle it either. Needs to
          # go specifically under the [options] section - appending to
          # end-of-file landed it inside pacman.conf's last repo section
          # instead (whichever one happens to be last), where pacman just
          # warns and ignores it:
          #   warning: config file .../pacman.conf, line 84: directive
          #   'XferCommand' in section 'dkp-linux' not recognized.
          PACMAN_CONF="$DEVKITPRO/pacman/etc/pacman.conf"
          if ! grep -q '^XferCommand' "$PACMAN_CONF"; then
            $SUDO sed -i '/^\[options\]/a XferCommand = /usr/bin/wget -O %o %u' "$PACMAN_CONF"
          fi

          # Once the 403 above is out of the way, the sync still fails -
          # consistently, on byte-identical downloads each time, so it's not
          # a corrupted-transfer problem:
          #   error: dkp-libs: signature from "... WinterMute ..." is
          #   invalid
          # A lot was tried here to fix this properly: reinstalling
          # devkitpro-pacman to force a fresh keyring bootstrap (dead end -
          # same package version, byte-identical bundled key data every
          # time), then fetching devkitPro's canonical keyring straight
          # from GitHub and fully lsigning every key in it (this looked
          # right and even verified cleanly in an isolated local
          # reproduction - `gpg --verify` against the actual dkp-libs.db.sig
          # came back "Good signature ... [full]" once lsigned - so the
          # signature itself is genuinely valid and the trust mechanism
          # genuinely works). It just doesn't reproduce inside the actual
          # container: every run still shows "WARNING: unsafe permissions
          # on homedir" on the baked-in gnupg dir, which a clean local
          # homedir never hits, and pacman's own gpgme-based verification
          # keeps calling it invalid regardless. Rather than keep chasing a
          # container-specific gpg/gpgme quirk blind with no way to
          # actually inspect that homedir, just don't require the
          # signature: this is fetched over HTTPS from devkitPro's own
          # official host already, and PGP verification on top is defense
          # in depth this pipeline can live without rather than keep
          # re-litigating.
          if grep -q '^SigLevel' "$PACMAN_CONF"; then
            $SUDO sed -i 's/^SigLevel.*/SigLevel = Never/' "$PACMAN_CONF"
          else
            $SUDO sed -i '/^\[options\]/a SigLevel = Never' "$PACMAN_CONF"
          fi

          $SUDO dkp-pacman -Sy --noconfirm 3ds-curl 3ds-mpg123 3ds-mbedtls

          # makerom (used for the .cia build) isn't a devkitPro package at
          # all - it's a separate tool from Project_CTR that devkitPro's own
          # docs point you at downloading manually and adding to PATH.
          # Two different approaches to running makerom-v0.19.0's prebuilt
          # Ubuntu binary against this container's older glibc were tried
          # and abandoned here: patchelf --set-interpreter/--set-rpath on
          # the binary itself ran clean but didn't fix the runtime error,
          # and invoking a separately-downloaded newer ld.so directly with
          # --library-path *also* didn't - glibc's dynamic loader appears
          # to bind to its own sibling libc.so.6 too tightly for either to
          # reliably override once components merged into libc.so.6 in
          # recent glibc versions. Simpler fix: v0.19.0 (Jan 2026) needs
          # GLIBC_2.38; v0.18.4 (Sep 2023, likely built on an
          # ubuntu-22.04/glibc-2.35 CI runner) is old enough to already be
          # covered by this Debian-bookworm-based image's own glibc, with
          # no version-specific flags in play (see the plain -f/-o/-elf/
          # -rsf/-icon invocation in the Makefile) - so there's nothing to
          # patch around at all.
          MAKEROM_VERSION="v0.18.4"
          wget -q "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-${MAKEROM_VERSION}/makerom-${MAKEROM_VERSION}-ubuntu_x86_64.zip" -O /tmp/makerom.zip
          $SUDO mkdir -p /opt/devkitpro/tools/bin
          $SUDO unzip -o /tmp/makerom.zip -d /opt/devkitpro/tools/bin/
          $SUDO chmod +x /opt/devkitpro/tools/bin/makerom

          # bannertool (github.com/carstene1ns/3ds-bannertool) builds the
          # HOME Menu banner (Makefile's $(OUTPUT).bnr rule, only reachable
          # when Banner.png exists at the repo root) - also not a devkitPro
          # package, and its prebuilt releases need glibc 2.39+ (per its own
          # README), too new for this image - the exact same class of
          # problem makerom-v0.19.0 hit above. Built from source instead of
          # chasing an old-enough prebuilt release (unlike makerom, none
          # exists - carstene1ns/3ds-bannertool only ever publishes against
          # current glibc): it's a small, fully self-contained C++ project
          # (stb_image/stb_vorbis/dr_wav are vendored straight in the repo,
          # no external image/audio libs to install), and this image already
          # has everything else a from-source build needs - cmake >=3.28
          # (via bookworm-backports) and a host C++ compiler
          # (build-essential) - both baked in already, unlike makerom's own
          # from-scratch toolchain requirements.
          BANNERTOOL_VERSION="1.2.3"
          git clone --branch "$BANNERTOOL_VERSION" --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/3ds-bannertool
          cmake -B /tmp/3ds-bannertool/build -S /tmp/3ds-bannertool -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3ds-bannertool/build --parallel
          $SUDO cp /tmp/3ds-bannertool/build/bannertool /opt/devkitpro/tools/bin/bannertool
          $SUDO chmod +x /opt/devkitpro/tools/bin/bannertool

      - name: Build (.elf, .3dsx, .cia)
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          make clean
          make
          ls -la DualPlex.elf DualPlex.3dsx DualPlex.cia

      # Tells the rest of this job whether it's building the rolling nightly
      # (a branch push or a manual run) or a permanent versioned release (a
      # "V*" tag push) - everything below keys off tag_name so the QR code
      # and the actual release step both point at wherever this run's build
      # is really going to end up.
      - name: Determine release parameters
        id: release_vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=nightly" >> "$GITHUB_OUTPUT"
          fi

      # Points at the exact URL this same release publishes DualPlex.cia at
      # (predictable from the tag name, independent of upload order -
      # constructing it doesn't require the upload to have happened yet,
      # only for the QR to actually resolve once it has). Uses a public
      # QR-generation API (goqr.me) via plain curl rather than installing a
      # QR tool locally (e.g. qrencode) - swap this step for `qrencode`
      # directly if you'd rather not depend on a third party (the URL
      # itself is already public once released, so there's nothing
      # sensitive being sent).
      - name: Generate QR code (CIA remote-install link)
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.release_vars.outputs.tag_name }}/DualPlex.cia"
          curl -sf -G "https://api.qrserver.com/v1/create-qr-code/" \
            --data-urlencode "size=300x300" \
            --data-urlencode "data=${DOWNLOAD_URL}" \
            -o DualPlex-qr.png

      - name: Publish rolling "nightly" release
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "DualPlex (nightly build)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          body: |
            Automated build from commit ${{ github.sha }}, replaces the previous nightly build.

            - **DualPlex.cia**: install with [FBI](https://github.com/Steveice10/FBI) - either sideload the file directly, or open FBI's "Remote Install" QR scanner on your 3DS and scan the code below to fetch and install it directly, no PC transfer needed.
            - **DualPlex.3dsx**: copy to `/3ds/` on your SD card to run via the Homebrew Launcher.

            ![DualPlex.cia remote-install QR code](https://github.com/${{ github.repository }}/releases/download/nightly/DualPlex-qr.png)
          files: |
            DualPlex.cia
            DualPlex.3dsx
            DualPlex-qr.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushing a "V*" tag (e.g. V1.0) publishes a real, permanent release
      # under that tag instead - left alone by every later nightly rebuild,
      # unlike the "nightly" release/tag above which the step above
      # overwrites in place on every push to main.
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DualPlex ${{ github.ref_name }}"
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            DualPlex ${{ github.ref_name }}, built from commit ${{ github.sha }}.

            - **DualPlex.cia**: install with [FBI](https://github.com/Steveice10/FBI) - either sideload the file directly, or open FBI's "Remote Install" QR scanner on your 3DS and scan the code below to fetch and install it directly, no PC transfer needed.
            - **DualPlex.3dsx**: copy to `/3ds/` on your SD card to run via the Homebrew Launcher.

            ![DualPlex.cia remote-install QR code](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DualPlex-qr.png)
          files: |
            DualPlex.cia
            DualPlex.3dsx
            DualPlex-qr.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
